name: Build Termux packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag name for the release to upload assets to
        required: true
        type: string
      release_title:
        description: Optional release title when creating a release from a manual run
        required: false
        type: string
      prerelease:
        description: Mark a newly created manual release as a prerelease
        required: false
        default: false
        type: boolean
  release:
    types:
      - published

permissions:
  contents: write

env:
  PACKAGE_NAME: linuxthemestore
  TERMUX_PACKAGES_REF: master
  TERMUX_PREFIX: /data/data/com.termux/files/usr

jobs:
  termux-package:
    name: Build Termux package
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out Termux packaging tools
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages

      - name: Render Termux package recipe
        env:
          RECIPE_TEMPLATE: ${{ github.workspace }}/packaging/termux/build.sh
          RECIPE_DIR: ${{ github.workspace }}/termux-packages/custom-packages/${{ env.PACKAGE_NAME }}
        run: |
          set -euo pipefail

          src_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          curl -fsSL "${src_url}" -o "/tmp/${PACKAGE_NAME}.tar.gz"
          src_sha256="$(sha256sum "/tmp/${PACKAGE_NAME}.tar.gz" | cut -d' ' -f1)"
          package_version="$(python - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path("Cargo.toml").open("rb") as cargo_toml:
              print(tomllib.load(cargo_toml)["package"]["version"])
          PY
          )"

          mkdir -p "${RECIPE_DIR}"

          PACKAGE_VERSION="${package_version}" \
          PACKAGE_SRCURL="${src_url}" \
          PACKAGE_SHA256="${src_sha256}" \
          PACKAGE_MAINTAINER="@${GITHUB_REPOSITORY_OWNER}" \
          python - <<'PY'
          import os
          from pathlib import Path

          recipe = Path(os.environ["RECIPE_TEMPLATE"]).read_text()
          replacements = {
              "@VERSION@": os.environ["PACKAGE_VERSION"],
              "@SRCURL@": os.environ["PACKAGE_SRCURL"],
              "@SHA256@": os.environ["PACKAGE_SHA256"],
              "@MAINTAINER@": os.environ["PACKAGE_MAINTAINER"],
          }

          for needle, value in replacements.items():
              recipe = recipe.replace(needle, value)

          output = Path(os.environ["RECIPE_DIR"]) / "build.sh"
          output.write_text(recipe)
          output.chmod(0o755)
          PY

      - name: Build Termux package
        working-directory: ${{ github.workspace }}/termux-packages
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 "custom-packages/${PACKAGE_NAME}"

      - name: Upload Termux package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-${{ env.PACKAGE_NAME }}-aarch64
          path: |
            ${{ github.workspace }}/termux-packages/output/*.deb
            ${{ github.workspace }}/termux-packages/output/*.buildinfo
          if-no-files-found: error

      - name: Ensure target release exists
        id: target-release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          MANUAL_RELEASE_TITLE: ${{ inputs.release_title }}
          MANUAL_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"
          else
            release_tag="${MANUAL_RELEASE_TAG}"
            if ! gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              create_args=(
                "${release_tag}"
                --repo "${GITHUB_REPOSITORY}"
                --target "${GITHUB_SHA}"
                --notes "Manual Termux package build from workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
              )
              if [ -n "${MANUAL_RELEASE_TITLE}" ]; then
                create_args+=(--title "${MANUAL_RELEASE_TITLE}")
              fi
              if [ "${MANUAL_RELEASE_PRERELEASE}" = "true" ]; then
                create_args+=(--prerelease)
              fi
              gh release create "${create_args[@]}"
            fi
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("${{ github.workspace }}/termux-packages/output/"*.deb)
          buildinfo_files=("${{ github.workspace }}/termux-packages/output/"*.buildinfo)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No .deb files were produced for release upload." >&2
            exit 1
          fi
          assets+=("${buildinfo_files[@]}")
          gh release upload "${{ steps.target-release.outputs.tag }}" \
            "${assets[@]}" \
            --clobber
